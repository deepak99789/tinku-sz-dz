name: Zone Scanner - Forex + Commodity + Crypto

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # 🔥 Prevent concurrent runs from interfering with state
    concurrency:
      group: forex-scan
      cancel-in-progress: false
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy yfinance requests matplotlib

      - name: 🔥 Pull latest state BEFORE scanning
        run: |
          git config user.name "zone-scanner-bot"
          git config user.email "actions@github.com"
          
          echo "📂 Pulling latest state..."
          git pull origin main --no-rebase 2>&1 || true
          
          # Ensure state file exists
          [ -f "alert_state_forex.json" ] || echo "[]" > alert_state_forex.json
          
          echo "📂 State file before scan:"
          head -20 alert_state_forex.json
          echo "..."

      - name: Run Forex Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_FOREX: ${{ secrets.TELEGRAM_CHAT_ID_FOREX }}
        run: python alert_bot_forex.py

      - name: 🔥 Commit & Push state atomically
        run: |
          git config user.name "zone-scanner-bot"
          git config user.email "actions@github.com"
          
          # Ensure state exists
          [ -f "alert_state_forex.json" ] || echo "[]" > alert_state_forex.json
          
          echo "📂 State file after scan:"
          head -20 alert_state_forex.json
          echo "..."
          
          # Stage state file
          git add alert_state_forex.json
          
          # Check if anything changed
          if git diff --cached --quiet; then
            echo "✅ No new alerts detected"
            exit 0
          fi
          
          # Commit and push atomically
          echo "📤 New alerts found, committing..."
          git commit -m "🔔 Forex alerts [skip ci]"
          
          # Retry logic for push
          for i in {1..3}; do
            if git push origin main; then
              echo "✅ State pushed successfully"
              exit 0
            fi
            echo "⚠️ Push attempt $i failed, retrying..."
            sleep 2
          done
          
          echo "❌ Push failed after 3 attempts"
          exit 1
